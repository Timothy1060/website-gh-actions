name: Deploy static site

on: 
    push: 
        branches:
            - master
    workflow-dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs: 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (change path if your site is in a subfolder)
          path: '.'          # or 'docs' / 'public' / 'dist' etc.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4