<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Pages Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn {
      display: inline-block;
      background: linear-gradient(to right, #0ea5e9, #6366f1);
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 0.75rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Live on GitHub Pages</div>
    <h1>Hello, World!</h1>
    <p>
      This is a sample static website deployed with<br>
      <strong>GitHub Actions + GitHub Pages</strong>.
    </p>
  </div>

  <footer>
    Deployed automatically on every push to <code>master</code>
  </footer>
</body>
</html>
